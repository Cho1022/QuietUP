spring:
  application:
    name: quietup-server
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

quietup:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    access-expiration-seconds: ${JWT_ACCESS_EXPIRATION_SECONDS}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS}
